<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi!</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <h1>Hello, World!</h1>
    <h2>Welcome to ComfortCSS Container</h2>
    <p>This is a simple example of using the ComfortCSS Container package.</p>
    <a href="#">Learn more</a>

    <div class="container">
        <h1>Hello, World!</h1>
    </div>

    <div class="container container-sm">
        <h1>Hello, World!</h1>
    </div>
    <div class="container container-lg">
        <h1>Hello, World!</h1>
    </div>
    <div class="container container-full">
        <h1>Hello, World!</h1>
    </div>

    <div class="container cq-adaptive">
        <h2>Adaptive Heading</h2>
        <p>This text resizes based on container width.</p>
    </div>
    <div class="container cq-side-by-side">
        <div>Left</div>
        <div>Right</div>
    </div>
</body>
</html>
